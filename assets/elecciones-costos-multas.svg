<svg xmlns="http://www.w3.org/2000/svg" width="780" height="440" viewBox="0 0 780 440" role="img" aria-labelledby="title desc">
<title id="title">Costos y multas electorales en el Perú</title>
<desc id="desc">Comparación del presupuesto electoral 2021 de 804 millones de soles con un escenario teórico de multas por inasistencia de 1 031 millones de soles. Estas cifras potenciales no equivalen a ingresos efectivamente recaudados.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#12304a"/><stop offset=".56" stop-color="#172f48"/><stop offset="1" stop-color="#0d2236"/></linearGradient>
 <linearGradient id="mint" x1="0" x2="1"><stop stop-color="#2aa897"/><stop offset="1" stop-color="#6ce9c5"/></linearGradient>
 <linearGradient id="slate" x1="0" x2="1"><stop stop-color="#5877a7"/><stop offset="1" stop-color="#a4c5ee"/></linearGradient>
 <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" stroke="#58738b" stroke-width=".65" fill="none" opacity=".28"/></pattern>
</defs>
<rect width="780" height="440" rx="12" fill="url(#bg)"/>
<rect width="780" height="440" rx="12" fill="url(#grid)"/>
<circle cx="700" cy="74" r="100" fill="none" stroke="#86c8c7" stroke-opacity=".13" stroke-width="1.5"/>
<circle cx="700" cy="74" r="145" fill="none" stroke="#86c8c7" stroke-opacity=".09" stroke-width="1.5"/>
<rect x="31" y="28" width="6" height="25" rx="3" fill="#63e0be"/>
<text x="54" y="48" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="2" fill="#72e4c9">ELECCIONES EN EL PERÚ</text>
<text x="32" y="98" font-family="Arial,sans-serif" font-size="35" font-weight="800" fill="#f1f8fa">¿Se pagan solas?</text>
<text x="33" y="129" font-family="Arial,sans-serif" font-size="18" fill="#afc4d4">Costos y multas · Elecciones generales de 2021</text>
<line x1="32" y1="155" x2="745" y2="155" stroke="#7495a8" stroke-opacity=".35"/>
<text x="33" y="186" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#d7e8ef">Multas potenciales</text>
<text x="747" y="186" text-anchor="end" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#79e9cb">S/ 1 031 millones</text>
<rect x="33" y="200" width="714" height="26" rx="5" fill="#2e465c"/>
<rect x="33" y="200" width="714" height="26" rx="5" fill="url(#mint)"/>
<text x="33" y="267" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#d7e8ef">Presupuesto electoral</text>
<text x="747" y="267" text-anchor="end" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#b7d0f8">S/ 804 millones</text>
<rect x="33" y="281" width="714" height="26" rx="5" fill="#2e465c"/>
<rect x="33" y="281" width="557" height="26" rx="5" fill="url(#slate)"/>
<rect x="33" y="340" width="714" height="65" rx="7" fill="#0c2034" stroke="#456779" stroke-opacity=".8"/>
<circle cx="59" cy="371" r="11" fill="#63e0be" fill-opacity=".17" stroke="#63e0be"/>
<path d="M59 365v8m0 5v.1" stroke="#6eecd1" stroke-width="2.5" stroke-linecap="round"/>
<text x="84" y="364" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#eff9fa">Escenario teórico de recaudación máxima</text>
<text x="84" y="388" font-family="Arial,sans-serif" font-size="15" fill="#b5cbd9">No equivale a multas efectivamente pagadas</text>
</svg>